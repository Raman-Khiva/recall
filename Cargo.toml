[package]
name = "recall"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
bat = { version = "0.26", default-features = false, features = ["regex-fancy"] }
clap = { version = "4.6.10", features = ["derive"] }
dirs = "7.0.0"
groqai = "0.1.10"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = {version = "0.43.0", features = ["bundled"]}

serde = "1.0.229"
serde_json = "1.0.154"
terminal_size = "0.4.4"
textwrap = "0.16.4"
tokio = "1.54.1"
